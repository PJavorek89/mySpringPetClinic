# Development profile is active by default (enables the DataLoader with sample data).
spring.profiles.default=dev

# In-memory H2; schema is generated from the entities and dropped on shutdown.
spring.datasource.url=jdbc:h2:mem:petclinic
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# MCP server (Spring AI): Streamable HTTP, endpoint /mcp. Tools live in the mcp package.
spring.ai.mcp.server.name=pet-clinic
spring.ai.mcp.server.protocol=STREAMABLE

# Don't keep the JPA session open during view rendering; the API will work with DTOs anyway.
spring.jpa.open-in-view=false
