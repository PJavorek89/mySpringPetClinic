# Development profile is active by default (enables the DataLoader with sample data).
spring.profiles.default=dev

# In-memory H2; schema is generated from the entities and dropped on shutdown.
spring.datasource.url=jdbc:h2:mem:petclinic
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Don't keep the JPA session open during view rendering; the API will work with DTOs anyway.
spring.jpa.open-in-view=false
